<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블록 쌓기</title>
<style>
  :root { --bg:#fafaf8; --fg:#1d1d1b; --muted:#66665f; --line:#d9d8d0; --card:#fff; --accent:#1f5fbf; --board:#f1efe8; --grid:#e2e0d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ecebe6; --muted:#a3a29a; --line:#3a3a36; --card:#1f1f1d; --accent:#7ab0ff; --board:#1b1b19; --grid:#2a2a27; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size:1.375rem; margin:0 0 12px; }
  .game { display:flex; gap:16px; align-items:flex-start; justify-content:center; }
  #board { height:min(68vh, 600px); aspect-ratio:1 / 2; width:auto; border:1px solid var(--line); border-radius:6px; background:var(--board); display:block; touch-action:none; }
  .side { display:flex; flex-direction:column; gap:10px; width:108px; flex:none; }
  .panel { border:1px solid var(--line); border-radius:8px; background:var(--card); padding:8px 12px; }
  .panel h2 { font-size:.75rem; font-weight:600; color:var(--muted); margin:0 0 2px; }
  .panel .v { font-size:1.25rem; font-variant-numeric:tabular-nums; }
  #next { display:block; margin:4px auto 0; width:100%; max-width:96px; height:auto; aspect-ratio:1; }
  button { font:inherit; white-space:nowrap; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; user-select:none; touch-action:manipulation; }
  button:active { background:var(--line); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .pad { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin-top:12px; }
  .pad button { padding:12px 0; font-size:1.125rem; }
  .help { margin:12px 0 0; font-size:.875rem; color:var(--muted); }
  @media (max-width: 420px) { .game { gap:10px; } .side { width:96px; } button { padding:8px 6px; font-size:.9375rem; } }
</style>
</head>
<body>
<main>
  <h1>블록 쌓기</h1>
  <div class="game">
    <canvas id="board" width="300" height="600" aria-label="게임 판"></canvas>
    <div class="side">
      <div class="panel"><h2>다음</h2><canvas id="next" width="96" height="96" aria-label="다음 블록"></canvas></div>
      <div class="panel"><h2>점수</h2><div class="v" id="score">0</div></div>
      <div class="panel"><h2>줄</h2><div class="v" id="lines">0</div></div>
      <div class="panel"><h2>레벨</h2><div class="v" id="level">1</div></div>
      <button type="button" id="pause">일시정지</button>
      <button type="button" id="restart">다시 시작</button>
    </div>
  </div>
  <div class="pad" aria-label="화면 조작 버튼">
    <button type="button" data-act="left" aria-label="왼쪽">◀</button>
    <button type="button" data-act="right" aria-label="오른쪽">▶</button>
    <button type="button" data-act="rotate" aria-label="회전">⟳</button>
    <button type="button" data-act="down" aria-label="아래로">▼</button>
    <button type="button" data-act="drop" aria-label="바로 내리기">⤓</button>
  </div>
  <p class="help">← → 이동 · ↑ 또는 X 회전 · Z 반대로 회전 · ↓ 천천히 내리기 · 스페이스 바로 내리기 · P 일시정지 · Enter 다시 시작</p>
</main>
<script src="game.js"></script>
<script>
(function () {
  'use strict';
  var G = BlockGame;
  var CELL = 30;
  var COLORS = { I:'#3fb6d6', O:'#e8c538', T:'#a05bd0', S:'#4cb86b', Z:'#e0534a', J:'#4b71d8', L:'#e8893a' };

  var boardCanvas = document.getElementById('board');
  var ctx = boardCanvas.getContext('2d');
  var nextCanvas = document.getElementById('next');
  var nctx = nextCanvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var linesEl = document.getElementById('lines');
  var levelEl = document.getElementById('level');
  var pauseBtn = document.getElementById('pause');

  var game = G.newGame();
  var paused = false;
  var acc = 0;
  var last = 0;

  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function cell(c, x, y, size, color, alpha) {
    c.globalAlpha = alpha == null ? 1 : alpha;
    c.fillStyle = color;
    c.fillRect(x + 1, y + 1, size - 2, size - 2);
    c.globalAlpha = 1;
  }

  function matrix(c, m, ox, oy, size, color, alpha) {
    for (var r = 0; r < m.length; r++)
      for (var k = 0; k < m[r].length; k++)
        if (m[r][k]) cell(c, ox + k * size, oy + r * size, size, color, alpha);
  }

  function drawBoard() {
    ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
    ctx.fillStyle = css('--board');
    ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
    ctx.strokeStyle = css('--grid');
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 1; i < G.WIDTH; i++) { ctx.moveTo(i * CELL + .5, 0); ctx.lineTo(i * CELL + .5, G.HEIGHT * CELL); }
    for (var j = 1; j < G.HEIGHT; j++) { ctx.moveTo(0, j * CELL + .5); ctx.lineTo(G.WIDTH * CELL, j * CELL + .5); }
    ctx.stroke();

    for (var r = 0; r < G.HEIGHT; r++)
      for (var c = 0; c < G.WIDTH; c++)
        if (game.board[r][c]) cell(ctx, c * CELL, r * CELL, CELL, COLORS[game.board[r][c]]);

    if (!game.over) {
      var p = game.piece;
      matrix(ctx, p.m, p.x * CELL, G.ghostY(game) * CELL, CELL, COLORS[p.type], 0.25); // 떨어질 자리
      matrix(ctx, p.m, p.x * CELL, p.y * CELL, CELL, COLORS[p.type]);
    }

    if (game.over || paused) {
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 28px system-ui, sans-serif';
      ctx.fillText(game.over ? '게임 끝' : '일시정지', boardCanvas.width / 2, boardCanvas.height / 2 - 8);
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillText(game.over ? 'Enter 또는 다시 시작' : 'P 로 계속', boardCanvas.width / 2, boardCanvas.height / 2 + 22);
    }
  }

  function drawNext() {
    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    var m = G.SHAPES[game.next];
    var size = 24;
    // 비어 있는 줄·칸을 빼고 가운데에 놓는다
    var minR = 9, maxR = -1, minC = 9, maxC = -1;
    for (var r = 0; r < m.length; r++) for (var c = 0; c < m[r].length; c++) if (m[r][c]) {
      minR = Math.min(minR, r); maxR = Math.max(maxR, r); minC = Math.min(minC, c); maxC = Math.max(maxC, c);
    }
    var ox = (nextCanvas.width - (maxC - minC + 1) * size) / 2 - minC * size;
    var oy = (nextCanvas.height - (maxR - minR + 1) * size) / 2 - minR * size;
    matrix(nctx, m, ox, oy, size, COLORS[game.next]);
  }

  function updatePanel() {
    scoreEl.textContent = String(game.score);
    linesEl.textContent = String(game.lines);
    levelEl.textContent = String(game.level);
  }

  function draw() { drawBoard(); drawNext(); updatePanel(); }

  function restart() {
    game = G.newGame();
    paused = false;
    acc = 0;
    pauseBtn.textContent = '일시정지';
    draw();
  }

  function togglePause() {
    if (game.over) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '계속' : '일시정지';
    draw();
  }

  var ACTIONS = {
    left: function () { G.move(game, -1); },
    right: function () { G.move(game, 1); },
    rotate: function () { G.rotate(game, 1); },
    rotateBack: function () { G.rotate(game, -1); },
    down: function () { G.softDrop(game); acc = 0; },
    drop: function () { G.hardDrop(game); acc = 0; }
  };

  function act(name) {
    if (game.over || paused) return;
    ACTIONS[name]();
    draw();
  }

  var KEYS = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'rotate', x:'rotate', X:'rotate', z:'rotateBack', Z:'rotateBack', ArrowDown:'down', ' ':'drop' };
  var REPEATABLE = { left:1, right:1, down:1 };

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'p' || e.key === 'P') { e.preventDefault(); if (!e.repeat) togglePause(); return; }
    if (e.key === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON') return; e.preventDefault(); if (game.over) restart(); return; }
    var name = KEYS[e.key];
    if (!name) return;
    e.preventDefault();
    if (e.repeat && !REPEATABLE[name]) return;
    act(name);
  });

  // 화면 버튼: 누르고 있으면 이동·내리기는 반복
  Array.prototype.forEach.call(document.querySelectorAll('.pad button'), function (btn) {
    var name = btn.getAttribute('data-act');
    var timer = null;
    function stop() { if (timer) { clearInterval(timer); timer = null; } }
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      act(name);
      if (REPEATABLE[name]) { stop(); timer = setInterval(function () { act(name); }, 110); }
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { btn.addEventListener(ev, stop); });
    btn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); } });
  });

  pauseBtn.addEventListener('click', function () { togglePause(); pauseBtn.blur(); });
  document.getElementById('restart').addEventListener('click', function () { restart(); document.getElementById('restart').blur(); });

  function frame(t) {
    var dt = Math.min(t - last, 250); // 다른 탭에 갔다 오면 한꺼번에 떨어지지 않게
    last = t;
    if (!paused && !game.over) {
      acc += dt;
      var interval = G.dropInterval(game.level);
      var changed = false;
      while (acc >= interval && !game.over) { acc -= interval; G.step(game); changed = true; }
      if (changed) draw();
    }
    requestAnimationFrame(frame);
  }

  draw();
  requestAnimationFrame(function (t) { last = t; frame(t); });
})();
</script>
</body>
</html>
